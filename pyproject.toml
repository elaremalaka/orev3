[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orev3"
version = "0.1.0"
description = "ORE Miner V3 research and mining platform"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "httpx>=0.27",
    "pydantic>=2.0",
    "solders>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]
